<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light dark">
    <title>User Help</title>
    <meta name="description" content="User help">
    <link rel="icon" href="assets/favicon.png">
    <link rel="stylesheet" href="/assets/css/fonts.css">
    <link rel="stylesheet" href="/assets/css/icons.css">
    <link rel="stylesheet" href="/assets/css/tobi.css">
    <link rel="stylesheet" href="/assets/css/app-landing.css">
</head>
<body class="page-help" data-app-id="Http-FS-Intro">
    <div class="scroll-progress"></div>
    <header>
        <nav class="navbar">
            <div class="navbar-start">
                <a href="/" class="logo">VR</a>
                <a href="./" class="nav-back" data-nav-back><i class="bi bi-arrow-left" aria-hidden="true"></i><span></span></a>
            </div>
            <span class="app-nav-title"></span>
            <div class="controls">
                <button id="theme-switch" class="btn-icon" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill"></i></button>
            </div>
        </nav>
    </header>

    <main class="app-main">
        <section class="app-hero app-hero--help container reveal">
            <div class="app-hero-grid">
                <img class="app-logo" src="" alt="">
                <div class="app-hero-body">
                    <span class="app-category"></span>
                    <h1 class="app-name"></h1>
                    <p class="app-developer"><a href="/">Vasyl Raiskyi</a></p>
                    <p class="app-tagline"></p>
                </div>
            </div>
        </section>
        <section class="section section--help-content container reveal">
            <div class="help-content">
                <div class="md_preview"></div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <div class="app-footer-inner">
            <p>&copy; <span data-year></span> Vasyl Raiskyi</p>
            <ul class="app-footer-links" data-app-footer></ul>
        </div>
    </footer>

    <script src="/assets/js/projects.js"></script>
    <script src="/assets/js/marked.min.js"></script>
    <script src="/assets/js/app-landing.js"></script>
</body>
</html>
